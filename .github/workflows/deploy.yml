name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an apply. Terraform's remote lock also covers local deployments.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # Standard runners are free for public repositories. Stop if visibility changes.
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://bahasadri.com
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:cloudflare
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test the local account server
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run test:browser -- tests/browser/accounts.spec.ts
      - name: Test the app with D1
        env:
          WARFRAME_TEST_BACKEND: cloudflare
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run test:browser
      - run: npm run build:cloudflare
      - name: Deploy through Terraform and verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy.mjs
